name: Docker Build & Publish

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      include_arm64:
        description: "Build for arm64 on native metal runner (ubuntu-24.04-arm) and create multi-arch manifest"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  REPO_NAME: ${{ github.repository }}

jobs:
  # Native Metal AMD64 Builder (Runs natively on ubuntu-latest x86_64, NO QEMU)
  build-amd64:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend, backend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO_NAME }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,format=short,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push native amd64 image (Direct)
        if: ${{ inputs.include_arm64 != true }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.service }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}-amd64
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-amd64

      - name: Build and push native amd64 image (For manifest merge)
        if: ${{ inputs.include_arm64 == true }}
        id: build-merge
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.service }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_NAME }}-${{ matrix.service }}:amd64-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}-amd64
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-amd64

  # Native Metal ARM64 Builder (Runs natively on ubuntu-24.04-arm, NO QEMU)
  build-arm64:
    if: ${{ inputs.include_arm64 == true }}
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        service: [frontend, backend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push native arm64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.service }}
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_NAME }}-${{ matrix.service }}:arm64-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}-arm64
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-arm64

  # Multi-Arch Manifest Merge (Combines native images via imagetools create)
  merge-multiarch:
    if: ${{ inputs.include_arm64 == true }}
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend, backend]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata for combined manifest
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO_NAME }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,format=short,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Create and push multi-arch manifest list
        run: |
          TAG_FLAGS=""
          for tag in ${{ steps.meta.outputs.tags }}; do
            TAG_FLAGS="$TAG_FLAGS -t $tag"
          done
          docker buildx imagetools create $TAG_FLAGS \
            ${{ env.REGISTRY }}/${{ env.REPO_NAME }}-${{ matrix.service }}:amd64-${{ github.sha }} \
            ${{ env.REGISTRY }}/${{ env.REPO_NAME }}-${{ matrix.service }}:arm64-${{ github.sha }}
