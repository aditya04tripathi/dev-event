services:
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/aditya04tripathi/dev-event-frontend}:${IMAGE_TAG:-latest}
    container_name: dev-event-frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NODE_ENV=production
      - API_INTERNAL_URL=http://backend:3000
      - MINIO_INTERNAL_URL=http://minio:9000
      - APP_PUBLIC_URL=${APP_PUBLIC_URL:-https://devevent.adityatripathi.dev}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - dev-event-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/aditya04tripathi/dev-event-backend}:${IMAGE_TAG:-latest}
    container_name: dev-event-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3001}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL:-mongodb://mongo:27017/dev-event}
      - JWT_SECRET=${JWT_SECRET:-dev-event-super-secret-jwt-key}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio:9000}
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL:-https://devevent.adityatripathi.dev/api/storage}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:-dev-event-bucket}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-password123}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-admin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-password123}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://devevent.adityatripathi.dev}
    depends_on:
      mongo:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - dev-event-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health/liveness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mongo:
    image: mongo:7.0
    container_name: dev-event-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - dev-event-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    image: quay.io/minio/minio:latest
    container_name: dev-event-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-password123}
    volumes:
      - minio_data:/data
    networks:
      - dev-event-net
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mongo_data:
    driver: local
  minio_data:
    driver: local

networks:
  dev-event-net:
    driver: bridge
