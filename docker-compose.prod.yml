# Pull-only. Do not add build:.
# Images:
#   ghcr.io/aditya04tripathi/dev-event/web
#   ghcr.io/aditya04tripathi/dev-event/api
#
# Cloudflare Tunnel (web only):
#   devevent.adityatripathi.dev -> http://127.0.0.1:49153
#
# Private package login:
#   echo "$GHCR_TOKEN" | docker login ghcr.io -u GITHUB_USERNAME --password-stdin
#
#   cp .env.production.example .env
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d

services:
  web:
    image: ghcr.io/aditya04tripathi/dev-event/web:${IMAGE_TAG:-latest}
    pull_policy: always
    ports:
      - "127.0.0.1:49153:49153"
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:3000
      MINIO_INTERNAL_URL: http://minio:9000
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://devevent.adityatripathi.dev}
    depends_on:
      api:
        condition: service_started
      minio:
        condition: service_healthy
    restart: unless-stopped

  api:
    image: ghcr.io/aditya04tripathi/dev-event/api:${IMAGE_TAG:-latest}
    pull_policy: always
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_here}
      DATABASE_URL: ${DATABASE_URL:-mongodb://mongodb:27017/dev-event}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-https://devevent.adityatripathi.dev/api/storage}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-dev-event-bucket}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-password123}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://devevent.adityatripathi.dev}
    depends_on:
      mongodb:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  mongodb:
    image: mongo:7
    pull_policy: always
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    pull_policy: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mongodb_data:
  minio_data:
